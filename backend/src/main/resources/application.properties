spring.datasource.url=jdbc:h2:mem:healthcaredb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.h2.console.enabled=true

# AI / LLM Configuration (OpenRouter)
llm.api.key=${OPENROUTER_API_KEY:dummy-key}
llm.api.url=https://openrouter.ai/api/v1/chat/completions
llm.api.model=openai/gpt-3.5-turbo

# Mail Configuration (Mocked via console for local dev)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false

# JobRunr Configuration (Background Jobs)
org.jobrunr.background-job-server.enabled=true
org.jobrunr.dashboard.enabled=false
org.jobrunr.dashboard.port=8000

# Google OAuth Config
google.client.id=${GOOGLE_CLIENT_ID:dummy-id}
google.client.secret=${GOOGLE_CLIENT_SECRET:dummy-secret}
server.port=8081