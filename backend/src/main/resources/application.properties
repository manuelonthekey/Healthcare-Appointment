spring.datasource.url=jdbc:h2:mem:healthcaredb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.h2.console.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# AI / LLM Configuration (OpenRouter)
llm.api.key=${OPENROUTER_API_KEY}
llm.api.url=https://openrouter.ai/api/v1/chat/completions
llm.api.model=openai/gpt-3.5-turbo

# Mail Configuration
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JobRunr Configuration (Background Jobs)
org.jobrunr.background-job-server.enabled=true
org.jobrunr.dashboard.enabled=false
org.jobrunr.dashboard.port=8000

# Google OAuth Config
google.client.id=${GOOGLE_CLIENT_ID:dummy-id}
google.client.secret=${GOOGLE_CLIENT_SECRET:dummy-secret}
server.port=8081