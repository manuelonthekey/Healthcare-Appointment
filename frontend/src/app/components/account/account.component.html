<div style="padding: 20px;">
  <h2>My Account</h2>
  <div class="card" style="max-width: 600px; margin-top: 20px; padding: 20px;">
    
    <div *ngIf="message" style="color: green; margin-bottom: 15px;">{{ message }}</div>
    <div *ngIf="error" style="color: red; margin-bottom: 15px;">{{ error }}</div>

    <form (ngSubmit)="saveProfile()">
      <div style="margin-bottom: 15px;">
        <label>Name</label><br/>
        <input type="text" [(ngModel)]="profile.name" name="name" style="width: 100%; padding: 8px; margin-top: 5px;"/>
      </div>
      
      <div style="margin-bottom: 15px;" *ngIf="isPatient">
        <label>Phone</label><br/>
        <input type="text" [(ngModel)]="profile.phone" name="phone" style="width: 100%; padding: 8px; margin-top: 5px;"/>
      </div>
      
      <div style="margin-bottom: 15px;" *ngIf="isPatient">
        <label>Date of Birth</label><br/>
        <input type="date" [(ngModel)]="profile.dob" name="dob" style="width: 100%; padding: 8px; margin-top: 5px;"/>
      </div>

      <div style="margin-bottom: 15px;" *ngIf="isDoctor">
        <label>Specialization</label><br/>
        <input type="text" [(ngModel)]="profile.specialization" name="specialization" style="width: 100%; padding: 8px; margin-top: 5px;"/>
      </div>

      <div style="margin-bottom: 15px;" *ngIf="isPatient">
        <label>Current Medications</label><br/>
        <textarea [(ngModel)]="profile.medications" name="medications" rows="3" style="width: 100%; padding: 8px; margin-top: 5px;"></textarea>
      </div>

      <div style="margin-bottom: 15px;" *ngIf="isPatient">
        <label>Health Notes / Allergies</label><br/>
        <textarea [(ngModel)]="profile.notes" name="notes" rows="3" style="width: 100%; padding: 8px; margin-top: 5px;"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Save Profile</button>
    </form>
  </div>

  <div class="card" style="max-width: 600px; margin-top: 30px; padding: 20px;" *ngIf="isPatient && summaries.length > 0">
    <h3>Recent Summaries</h3>
    <p>Import structured data from your recent AI-generated visit summaries.</p>
    <div *ngFor="let summary of summaries" style="border: 1px solid #ddd; padding: 15px; margin-top: 10px; border-radius: 4px;">
      <strong>Date:</strong> {{ summary.date }}<br/>
      <strong>Medications:</strong> {{ summary.aiSummary?.medications?.join(', ') || 'None' }}<br/>
      <strong>Notes:</strong> {{ summary.aiSummary?.notes || 'None' }}<br/>
      <button class="btn btn-outline mt-2" (click)="importFromSummary(summary)">
        <i class="fas fa-download"></i> Import into Profile
      </button>
    </div>
  </div>
</div>
