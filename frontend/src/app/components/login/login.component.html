<div style="max-width: 400px; margin: 50px auto; padding: 20px; font-family: sans-serif; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Login</h2>
  <div style="margin-bottom: 10px;">
    <label>Email: </label><br/>
    <input type="email" id="email" #emailInput style="width: 100%; padding: 8px;"/>
  </div>
  <div style="margin-bottom: 10px;">
    <label>Password: </label><br/>
    <input type="password" id="password" #passwordInput style="width: 100%; padding: 8px;"/>
  </div>
  <button (click)="onLogin(emailInput.value, passwordInput.value)" style="padding: 10px 15px; cursor: pointer;">Login</button>
  
  <p *ngIf="message" style="color: green; margin-top: 15px; word-wrap: break-word;">{{ message }}</p>
  <p *ngIf="error" style="color: red; margin-top: 15px;">{{ error }}</p>
</div>
